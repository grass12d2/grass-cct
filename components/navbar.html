<!-- ==================== NAVBAR ==================== -->
<nav
    class="sticky top-0 z-40 bg-amber-100 dark:bg-[#0a0a0a] border-b border-amber-200/60 dark:border-gray-700/60 shadow-sm">
    <div class="max-w-screen-xl mx-auto px-4">
        <div class="flex items-center justify-between gap-3 py-3">

            <!-- Bên trái: Toggle + Logo text -->
            <div class="flex items-center gap-3 flex-shrink-0">
                <button id="tools-toggle" type="button"
                    class="w-10 h-10 flex items-center justify-center text-gray-600 dark:text-gray-400 rounded-full transition-colors"
                    aria-label="Mở công cụ" aria-controls="tools-drawer">
                    <i class="fas fa-bars text-xl leading-none"></i>
                </button>
                <a href="/index.html" class="group flex items-baseline gap-1.5">
                    <span
                        class="text-2xl font-bold text-amber-950 dark:text-white group-hover:text-amber-700 dark:group-hover:text-amber-400 transition-colors leading-none">
                        Grass
                    </span>
                    <span id="navbar-brand-sup"
                        class="text-[12px] tracking-[0.15em] font-semibold text-amber-700 dark:text-amber-400 -translate-y-2 group-hover:text-amber-800 dark:group-hover:text-amber-300 transition-colors">
                        EAD
                    </span>
                </a>
            </div>

            <!-- Giữa: Fake search bar -->
            <button id="search-trigger" type="button"
                class="hidden md:flex flex-1 max-w-md mx-auto items-center gap-3 px-4 py-2.5 rounded-xl bg-amber-50/70 dark:bg-gray-800 border border-amber-200 dark:border-gray-700 text-left text-sm text-gray-500 dark:text-gray-400 hover:bg-amber-100/70 dark:hover:bg-gray-700/70 hover:border-amber-300 dark:hover:border-gray-600 transition-all group">
                <i class="fas fa-search text-gray-400 group-hover:text-amber-500 transition-colors"></i>
                <span class="flex-1">Tìm thuật toán...</span>
                <!-- Windows / Linux: Ctrl+K -->
                <kbd
                    class="kbd-ctrl hidden items-center gap-0.5 text-[11px] font-mono text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded px-2 py-0.5">
                    Ctrl+K
                </kbd>

                <!-- macOS / iPadOS: ⌘K -->
                <kbd
                    class="kbd-mac hidden items-center gap-0.5 text-[12px] font-mono text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded px-2 py-0.5">
                    <span
                        style="font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; line-height: 1;">⌘</span>K
                </kbd>
            </button>

            <!-- Bên phải: Search mobile + Theme toggle -->
            <div class="flex items-center gap-2 flex-shrink-0">
                <button id="search-mobile-trigger" type="button"
                    class="md:hidden w-10 h-10 flex items-center justify-center text-gray-600 dark:text-gray-400 rounded-full transition-colors"
                    aria-label="Tìm kiếm">
                    <i class="fas fa-search text-lg leading-none"></i>
                </button>

                <!-- Theme toggle: dùng Font Awesome icon thay vì SVG -->
                <button id="theme-toggle" type="button"
                    class="w-10 h-10 flex items-center justify-center text-gray-600 dark:text-gray-400 hover:bg-amber-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-amber-200 dark:focus:ring-gray-700 rounded-full transition-colors"
                    aria-label="Đổi theme">
                    <i id="theme-toggle-dark-icon" class="fas fa-moon text-lg leading-none"
                        style="display: inline;"></i>
                    <i id="theme-toggle-light-icon" class="fas fa-sun text-lg leading-none" style="display: none;"></i>
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- ==================== SEARCH POPUP ==================== -->
<div id="search-popup" style="display: none; position: fixed; inset: 0; z-index: 200;">
    <!-- Backdrop mờ -->
    <div id="search-popup-backdrop"
        style="position: absolute; inset: 0; background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.15s ease;">
    </div>

    <!-- Panel: căn giữa cả ngang lẫn dọc, kích thước cố định -->
    <div id="search-popup-panel"
        style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); width: 92vw; max-width: 640px; height: 70vh; max-height: 600px; min-height: 320px; opacity: 0; transition: opacity 0.15s ease, transform 0.15s ease;">
        <div id="search-popup-inner"
            style="background: white; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); overflow: hidden; border: 1px solid rgba(251, 191, 36, 0.3); height: 100%; display: flex; flex-direction: column;">
            <style>
                .dark #search-popup-inner {
                    background: #1f2937 !important;
                    border-color: rgba(75, 85, 99, 0.6) !important;
                }
            </style>

            <!-- Input row (cố định, không cuộn) -->
            <div class="flex-shrink-0 flex items-center gap-3 px-5 py-4 border-b border-amber-100 dark:border-gray-700">
                <i class="fas fa-search text-amber-500 text-xl flex-shrink-0"></i>
                <input type="text" id="search-popup-input" autocomplete="off" placeholder="Tìm thuật toán mã hoá…"
                    class="flex-1 bg-transparent border-0 outline-none text-base text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500" />
                <button id="search-popup-clear" type="button"
                    class="hidden text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 rounded p-1 transition-colors"
                    aria-label="Xoá">
                    <i class="fas fa-times-circle text-lg"></i>
                </button>
                <kbd
                    class="hidden sm:flex items-center gap-1 text-xs font-mono text-gray-500 dark:text-gray-400 bg-amber-50 dark:bg-gray-700 border border-amber-200 dark:border-gray-600 rounded px-2 py-1 flex-shrink-0">
                    ESC
                </kbd>
            </div>

            <!-- Results: chiếm hết chiều cao còn lại, cuộn khi tràn -->
            <div id="search-popup-results" class="flex-1 overflow-y-auto p-2"></div>

            <!-- Footer (cố định, không cuộn) -->
            <div
                class="flex-shrink-0 px-5 py-3 border-t border-amber-100 dark:border-gray-700 bg-amber-50/50 dark:bg-gray-900/40 flex items-center justify-between gap-3 text-xs text-gray-500 dark:text-gray-400">
                <div class="flex items-center gap-4">
                    <span class="flex items-center gap-1.5">
                        <kbd
                            class="inline-flex items-center justify-center w-8 h-8 font-mono text-lg font-semibold bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-md shadow-sm text-gray-700 dark:text-gray-200">↑</kbd>
                        <kbd
                            class="inline-flex items-center justify-center w-8 h-8 font-mono text-lg font-semibold bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-md shadow-sm text-gray-700 dark:text-gray-200">↓</kbd>
                        <span class="ml-1">Di chuyển</span>
                    </span>
                    <span class="flex items-center gap-1.5">
                        <kbd
                            class="inline-flex items-center justify-center w-8 h-8 font-mono text-xl font-semibold bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-md shadow-sm text-gray-700 dark:text-gray-200">↵</kbd>
                        <span class="ml-1">Mở</span>
                    </span>
                </div>
                <span id="search-popup-count" class="hidden sm:inline"></span>
            </div>
        </div>
    </div>
</div>
