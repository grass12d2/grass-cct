<!DOCTYPE html>
<html lang="vi" class="light">

<head>
    <script>
        (function () {
            try {
                var s = localStorage.getItem('theme');
                var d = window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (s === 'dark' || (!s && d)) document.documentElement.classList.add('dark');
            } catch (e) { }
        })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caesar - Grass EAD</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../css/output.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body class="bg-amber-50 dark:bg-gray-900 flex flex-col">
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Sidebar (drawer) -->
    <div id="sidebar-placeholder"></div>

    <main class="max-w-screen-xl mx-auto p-6 flex-1 w-full">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-6 text-center">Mã hoá Caesar</h1>

        <div class="bg-blue-100 dark:bg-gray-800 border border-blue-200 dark:border-gray-700 p-4 rounded-lg mb-6">
            <p class="text-sm text-gray-700 dark:text-gray-300">
                <i class="fas fa-info-circle text-blue-500 mr-1"></i>
                <strong>Quy tắc:</strong>
                Mỗi chữ cái được dịch chuyển đi <strong>shift</strong> vị trí trong bảng chữ cái (mod 32).
                <br>
                <strong>Ví dụ:</strong> Shift = 3, "АБВ" → "ГДЕ" (А→Г, Б→Д, В→Е)
                <br>
                <span class="text-blue-500 dark:text-blue-400">
                    <i class="fas fa-lightbulb mr-1"></i>
                    Shift có thể âm (dịch ngược) và được chuẩn hoá theo mod 32.
                </span>
            </p>
        </div>

        <div class="space-y-6">
            <!-- Controls -->
            <div
                class="flex flex-wrap items-center gap-4 p-4 bg-amber-100 dark:bg-gray-800 rounded-lg shadow border border-amber-200 dark:border-gray-700">
                <div class="flex items-center gap-2">
                    <button id="mode-encrypt"
                        class="px-4 py-2 bg-red-500 border-2 border-red-500 text-white rounded-lg text-sm font-medium transition-colors shadow-md">
                        <i class="fas fa-lock mr-1"></i> Mã hoá
                    </button>
                    <button id="mode-decrypt"
                        class="px-4 py-2 bg-transparent border-2 border-blue-400 text-blue-500 dark:text-blue-400 rounded-lg text-sm font-medium transition-colors hover:bg-blue-50 dark:hover:bg-blue-900/20">
                        <i class="fas fa-lock-open mr-1"></i> Giải mã
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <span class="text-sm font-medium dark:text-white">Shift:</span>
                    <button id="shift-decrease"
                        class="px-3 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-minus"></i>
                    </button>
                    <input type="number" id="shift-number" value="3" min="-31" max="31"
                        class="w-16 px-2 py-2 text-center bg-amber-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-sm dark:text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
                    <button id="shift-increase"
                        class="px-3 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded-lg text-sm font-medium transition-colors">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>

                <div class="flex-1 min-w-[150px]">
                    <input type="range" id="shift" min="-31" max="31" value="3"
                        class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer"
                        style="background: linear-gradient(to right, #3b82f6 0%, #3b82f6 50%, #e5e7eb 50%, #e5e7eb 100%);" />
                    <div class="flex justify-between text-xs text-gray-500 dark:text-gray-400 mt-1">
                        <span>-31</span>
                        <span>0</span>
                        <span>31</span>
                    </div>
                </div>
            </div>

            <!-- Input/Output -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label id="input-label" class="text-sm font-medium dark:text-white">Văn bản gốc</label>
                        <div class="flex items-center gap-2">
                            <button id="paste-btn"
                                class="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-xs font-medium transition-colors">
                                <i class="fas fa-paste mr-1"></i> Dán
                            </button>
                            <button id="copy-input-btn"
                                class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg text-xs font-medium transition-colors">
                                <i class="fas fa-copy mr-1"></i> Sao chép
                            </button>
                        </div>
                    </div>
                    <textarea id="caesar-input" class="input-area" spellcheck="false" autocorrect="off"
                        autocapitalize="off" placeholder="Nhập văn bản tiếng Nga (ví dụ: ПРИВЕТ)"></textarea>
                </div>
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label id="output-label" class="text-sm font-medium dark:text-white">Văn bản mã hoá</label>
                        <div class="flex items-center gap-2">
                            <button id="copy-output-btn"
                                class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-lg text-xs font-medium transition-colors">
                                <i class="fas fa-copy mr-1"></i> Sao chép
                            </button>
                            <button id="clear-btn"
                                class="px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white rounded-lg text-xs font-medium transition-colors">
                                <i class="fas fa-trash mr-1"></i> Xoá
                            </button>
                        </div>
                    </div>
                    <textarea id="caesar-output" class="input-area" spellcheck="false" autocorrect="off"
                        autocapitalize="off" placeholder="Kết quả sẽ hiển thị ở đây" readonly></textarea>
                </div>
            </div>

            <!-- Div chi tiết từng ký tự (đặt TRÊN bảng Caesar) -->
            <div id="caesar-detail-wrapper"
                class="bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700 p-4">
                <div class="flex items-center justify-between gap-2 mb-4">
                    <h2 class="text-lg font-semibold text-gray-900 dark:text-white">
                        <i class="fas fa-list-ul text-blue-500 mr-2"></i>Chi tiết từng ký tự
                        <span id="detail-view-label"
                            class="text-sm font-normal text-gray-500 dark:text-gray-400 whitespace-nowrap ml-2">(Ngang)</span>
                    </h2>
                    <button id="view-toggle"
                        class="view-toggle-btn px-3 py-1.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg text-xs font-medium transition-colors shrink-0">
                        <i class="fas fa-sync-alt"></i><span class="view-toggle-text">Xem dọc</span>
                    </button>
                </div>
                <div id="caesar-detail" class="pb-2"></div>
            </div>

            <!-- Bảng Caesar -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700 p-4">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">
                    <i class="fas fa-table text-blue-500 mr-2"></i>Bảng mã hoá Caesar
                    <span class="text-sm font-normal text-gray-500 dark:text-gray-400 whitespace-nowrap ml-2">
                        (Shift = <span id="table-shift-value"
                            class="font-bold text-blue-600 dark:text-blue-400">3</span>)
                    </span>
                </h2>
                <div id="caesar-table" class="pb-2"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/caesar.js"></script>
</body>

</html>
